services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greatermemory
      POSTGRES_PASSWORD: greatermemory
      POSTGRES_DB: greatermemory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greatermemory -d greatermemory"]
      interval: 2s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: greatermemory
      RABBITMQ_DEFAULT_PASS: greatermemory
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URL: postgresql://greatermemory:greatermemory@postgres:5432/greatermemory
      VECTOR_DB_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://greatermemory:greatermemory@rabbitmq:5672/
      WORKER_URL: amqp://greatermemory:greatermemory@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
